name: Native TMT hydrogen checks
on:
  push:
    branches: [remake-zh, remake-en]
  pull_request:
    branches: [remake-zh, remake-en]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-tmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Check mod syntax
        run: |
          for file in js/remake/*.js; do node --check "$file"; done
      - name: Package native TMT game
        run: python3 scripts/package-preview.py preview
      - uses: actions/upload-artifact@v4
        with:
          name: native-tmt-hydrogen-${{ github.ref_name }}
          path: preview/
